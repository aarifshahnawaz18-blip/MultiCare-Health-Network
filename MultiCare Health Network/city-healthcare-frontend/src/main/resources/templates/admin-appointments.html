<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Appointments | CityCare Admin</title><link rel="stylesheet" href="/css/style.css"><style>.wrap{max-width:1250px;margin:30px auto;padding:0 18px}.panel{background:white;padding:20px;border:1px solid #e2e8f0;border-radius:14px;margin:18px 0;overflow:auto}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.tools input,.tools select{padding:11px;border:1px solid #cbd5e1;border-radius:8px;min-width:180px}table{border-collapse:collapse;width:100%;min-width:850px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e2e8f0}th{background:#f8fafc}.navlinks{display:flex;gap:14px;flex-wrap:wrap}.pill{padding:4px 8px;border-radius:20px;background:#e0f2fe}</style></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/admin/dashboard">+ CityCare Admin</a><div class="navlinks"><a href="/admin/dashboard">Dashboard</a><a href="/admin/doctors">Doctor Info</a><a href="/logout">Logout</a></div></div></nav><main class="wrap"><h1>All Appointments</h1><p class="muted">Appointments are sorted by date and time. Search by patient, doctor, email, status or reason.</p><section class="panel"><div class="tools"><input id="search" placeholder="Search appointments..." oninput="filterRows()"><input id="dateFilter" type="date" aria-label="Filter by date" oninput="filterRows()"><select id="statusFilter" onchange="filterRows()"><option value="">All statuses</option><option>BOOKED</option><option>COMPLETED</option><option>CANCELLED</option></select></div><table><thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Patient Email</th><th>Doctor</th><th>Specialization</th><th>Reason</th><th>Status</th></tr></thead><tbody id="rows"><tr th:each="a:${appointments}" th:attr="data-date=${a.appointmentDate},data-status=${a.status},data-search=${a.patientName+' '+a.patient.email+' '+a.doctor.fullName+' '+a.doctor.email+' '+a.doctor.specialization+' '+a.reason}"><td th:text="${#temporals.format(a.appointmentDate,'dd-MM-yyyy')}"></td><td th:text="${a.appointmentTime}"></td><td th:text="${a.patientName}"></td><td th:text="${a.patient.email}"></td><td th:text="${a.doctor.fullName}"></td><td th:text="${a.doctor.specialization}"></td><td th:text="${a.reason}"></td><td><span class="pill" th:text="${a.status}"></span></td></tr></tbody></table><p id="empty" style="display:none">No matching appointments found.</p></section></main><script>function filterRows(){let q=document.getElementById('search').value.toLowerCase(),d=document.getElementById('dateFilter').value,s=document.getElementById('statusFilter').value,n=0;document.querySelectorAll('#rows tr').forEach(r=>{let ok=(!q||(r.dataset.search||'').toLowerCase().includes(q))&&(!d||r.dataset.date===d)&&(!s||r.dataset.status===s);r.style.display=ok?'':'none';if(ok)n++});document.getElementById('empty').style.display=n?'none':''}</script><script src="/js/language.js"></script></body></html>
