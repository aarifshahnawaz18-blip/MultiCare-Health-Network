<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Patient Profile</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/patient-dashboard">+ CityCare</a><a href="/logout">Logout</a></div></nav><div class="container section"><div class="card" style="max-width:760px;margin:auto"><h1>My Profile</h1><div class="info-list"><div class="info-row"><b>Patient name</b><span th:text="${account.fullName}"></span></div><div class="info-row"><b>Email</b><span th:text="${account.email}"></span></div><div class="info-row"><b>Mobile</b><span th:text="${account.mobile}"></span></div><div class="info-row"><b>Age</b><span th:text="${account.age}"></span></div><div class="info-row"><b>Account status</b><span th:text="${account.status}"></span></div><div class="info-row"><b>Patient record</b><span th:text="${profile != null ? 'Created' : 'Not found'}"></span></div></div><hr><h3>Delete Patient Account</h3><p>This permanently removes your account, appointments, and prescriptions.</p><form method="post" action="/patient-profile/delete" onsubmit="return confirm('Permanently delete your account and records? This cannot be undone.')"><button class="btn" style="background:#b91c1c;color:white">Delete My Account</button></form></div></div><script src="/js/language.js"></script></body></html>
