<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Doctor Registration | City Healthcare</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/"><span class="logo">♡</span><span>City Healthcare<small style="display:block;font:500 11px 'DM Sans',sans-serif;color:#6d83a0">Your Health, Our Priority</small></span></a><a class="btn btn-outline" href="/doctor-login">Already registered? Login</a></div></nav><div class="auth-wrap"><div class="auth-card"><span class="tag">JOIN CITY HEALTHCARE</span><h1 style="margin-top:15px">Doctor Registration</h1><p class="muted">Submit your professional details for administrator verification.</p><p style="color:#b91c1c" th:if="${error}" th:text="${error}"></p><form class="auth-form" method="post" action="/register" enctype="multipart/form-data"><input type="hidden" name="role" value="DOCTOR"><div class="form-group"><label>Full Name</label><input class="form-control" name="fullName" required></div><div class="form-group"><label>Specialization</label><input class="form-control" name="specialization" required></div><div class="form-group"><label>Mobile</label><input class="form-control" name="mobile" required></div><div class="form-group"><label>Email</label><input class="form-control" name="email" type="email" required></div><div class="form-group"><label>Aadhaar Number (12 digits)</label><input class="form-control" name="aadhaarNumber" inputmode="numeric" pattern="[0-9]{12}" maxlength="12" required></div><div class="form-group"><label>PAN Number</label><input class="form-control" name="panNumber" pattern="[A-Za-z]{5}[0-9]{4}[A-Za-z]" maxlength="10" required></div><div class="form-group"><label>Medical Degree</label><input class="form-control" name="degree" placeholder="MBBS, MD..." required></div><div class="form-group"><label>Consultation Fee (₹)</label><input class="form-control" name="consultationFee" type="number" min="0" max="1000000" step="1" placeholder="e.g. 500" required><small>Fee patients will see when viewing your profile.</small></div><div class="form-group"><label>Doctor Profile Photo (image, max 3 MB)</label><input class="form-control" name="profilePhoto" type="file" accept="image/*" required></div><div class="form-group"><label>Degree Certificate (PDF or image, max 5 MB)</label><input class="form-control" name="degreeCertificate" type="file" accept=".pdf,image/*" required></div><div class="form-group"><label>Password (minimum 8 characters)</label><input class="form-control" name="password" type="password" minlength="8" required></div><button class="btn btn-primary" style="width:100%">Submit for Verification</button></form><p style="text-align:center;margin-top:20px">Already have an account? <a href="/doctor-login">Login here</a></p></div></div><script src="/js/language.js"></script></body></html>
