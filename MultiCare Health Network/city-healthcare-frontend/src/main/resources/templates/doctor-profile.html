<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Doctor Profile</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/doctor-dashboard">+ CityCare</a><a href="/logout">Logout</a></div></nav><div class="container section"><div class="card" style="max-width:850px;margin:auto"><h1>Doctor Profile</h1><p style="color:#b91c1c" th:if="${error}" th:text="${error}"></p><p style="color:#15803d" th:if="${success}" th:text="${success}"></p><img th:if="${account.profilePhotoPath != null}" th:src="@{'/doctor-photo/' + ${account.id}}" alt="Doctor photo" style="width:120px;height:120px;object-fit:cover;border-radius:50%"><div class="info-list"><div class="info-row"><b>Name</b><span th:text="${account.fullName}"></span></div><div class="info-row"><b>Email</b><span th:text="${account.email}"></span></div><div class="info-row"><b>Mobile</b><span th:text="${account.mobile}"></span></div><div class="info-row"><b>Specialization</b><span th:text="${account.specialization}"></span></div><div class="info-row"><b>Degree</b><span th:text="${account.degree}"></span></div><div class="info-row"><b>Consultation Fee</b><span th:text="${account.consultationFee != null ? '₹' + account.consultationFee : 'Not set'}"></span></div><div class="info-row"><b>Aadhaar</b><span th:text="${account.aadhaarNumber != null ? 'XXXX-XXXX-' + #strings.substring(account.aadhaarNumber,8,12) : 'Not provided'}"></span></div><div class="info-row"><b>PAN</b><span th:text="${account.panNumber != null ? 'XXXXX' + #strings.substring(account.panNumber,5,10) : 'Not provided'}"></span></div><div class="info-row"><b>Verification status</b><span th:text="${account.status}"></span></div><div class="info-row"><b>Certificate file</b><span th:text="${profile != null and profile.degreeCertificatePath != null ? 'Uploaded for Admin verification' : 'Not available'}"></span></div></div><hr><h2>Request Profile Edit</h2><p>Changes appear publicly only after Admin approval.</p><form method="post" action="/doctor-profile/edit" enctype="multipart/form-data"><div class="form-group"><label>Full name</label><input class="form-control" name="fullName" th:value="${account.fullName}" required></div><div class="form-group"><label>Mobile</label><input class="form-control" name="mobile" th:value="${account.mobile}" required></div><div class="form-group"><label>Department / Specialization</label><input class="form-control" name="specialization" th:value="${account.specialization}" required></div><div class="form-group"><label>Degree</label><input class="form-control" name="degree" th:value="${account.degree}" required></div><div class="form-group"><label>Consultation Fee (₹)</label><input class="form-control" name="consultationFee" type="number" min="0" max="1000000" step="1" th:value="${account.consultationFee}" required></div><div class="form-group"><label>New profile photo (optional)</label><input class="form-control" type="file" name="profilePhoto" accept="image/*"></div><button class="btn btn-primary">Submit for Admin Approval</button></form></div></div><script src="/js/language.js"></script></body></html>
