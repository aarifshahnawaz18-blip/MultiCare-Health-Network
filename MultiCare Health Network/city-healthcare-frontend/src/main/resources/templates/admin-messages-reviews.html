<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Messages & Reviews | CityCare Admin</title><link rel="stylesheet" href="/css/style.css"><style>.wrap{max-width:1200px;margin:32px auto;padding:0 20px}.panel{background:#fff;border:1px solid #dbeafe;border-radius:18px;padding:24px;margin:20px 0;overflow:auto;box-shadow:0 12px 32px rgba(20,65,120,.09)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0;vertical-align:top}th{background:#f8fafc}</style></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/admin/dashboard">+ CityCare Admin</a><div class="nav-links"><a href="/admin/appointments">Appointments</a><a href="/admin/doctors">Doctor Info</a><a href="/admin/dashboard">Dashboard</a><a href="/logout">Logout</a></div></div></nav><main class="wrap"><h1>Messages &amp; Reviews</h1><section class="panel"><h2>Home page messages</h2><p th:if="${#lists.isEmpty(messages)}">No messages received.</p><table th:unless="${#lists.isEmpty(messages)}"><thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Message</th></tr></thead><tbody><tr th:each="m:${messages}"><td th:text="${m.createdAt}"></td><td th:text="${m.name}"></td><td th:text="${m.number}"></td><td th:text="${m.message}"></td></tr></tbody></table></section><section class="panel"><h2>Patient reviews</h2><p th:if="${#lists.isEmpty(reviews)}">No reviews received.</p><table th:unless="${#lists.isEmpty(reviews)}"><thead><tr><th>Date</th><th>Patient</th><th>Doctor</th><th>Doctor ID</th><th>Rating</th><th>Review</th></tr></thead><tbody><tr th:each="r:${reviews}"><td th:text="${r.createdAt}"></td><td th:text="${r.patient.fullName}"></td><td th:text="${r.doctor.fullName}"></td><td th:text="${r.doctor.id}"></td><td th:text="${r.rating + '/5'}"></td><td th:text="${r.review}"></td></tr></tbody></table></section></main><script src="/js/language.js"></script></body></html>
