<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Write Prescription</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/doctor-dashboard">+ CityCare</a></div></nav><div class="container section"><div class="card" style="max-width:800px;margin:auto"><h1>Write Prescription</h1><p class="muted">Select one of your appointments. Prescription will be attached to that patient account.</p><p style="color:#b91c1c" th:if="${error}" th:text="${error}"></p><p style="color:#15803d" th:if="${success}" th:text="${success}"></p><form method="post" action="/doctor-prescription"><div class="form-group"><label>Appointment / Patient</label><select class="form-control" name="appointmentId" required><option value="">Select patient appointment</option><option th:each="a:${appointments}" th:value="${a.id}" th:selected="${selectedAppointmentId != null and selectedAppointmentId == a.id}" th:text="${'#' + a.id + ' — ' + a.patient.fullName + ' — ' + a.appointmentDate + ' ' + a.appointmentTime}"></option></select></div><div class="form-group"><label>Diagnosis</label><input class="form-control" name="diagnosis" required maxlength="500"></div><div class="form-group"><label>Medicines and dosage</label><textarea class="form-control" name="medicines" rows="5" required maxlength="5000"></textarea></div><div class="form-group"><label>Instructions</label><textarea class="form-control" name="instructions" rows="4" maxlength="3000"></textarea></div><button class="btn btn-primary">Save Prescription to Patient Record</button></form></div></div><script src="/js/language.js"></script></body></html>
