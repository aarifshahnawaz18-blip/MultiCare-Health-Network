<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Patient Registration | City Healthcare</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/"><span class="logo">♡</span><span>City Healthcare<small style="display:block;font:500 11px 'DM Sans',sans-serif;color:#6d83a0">Your Health, Our Priority</small></span></a><a class="btn btn-outline" href="/patient-login">Already registered? Login</a></div></nav><div class="auth-wrap"><div class="auth-card"><span class="tag">JOIN CITY HEALTHCARE</span><h1 style="margin-top:15px">Create Your Account</h1><p class="muted">Join City Healthcare and take the first step toward better care.</p><p style="color:#b91c1c" th:if="${error}" th:text="${error}"></p><form class="auth-form" method="post" action="/register"><input type="hidden" name="role" value="PATIENT"><div class="form-group"><label>Full Name</label><input class="form-control" name="fullName" required></div><div class="form-group"><label>Age</label><input class="form-control" name="age" type="number" min="1" max="120"></div><div class="form-group"><label>Mobile</label><input class="form-control" name="mobile" pattern="[0-9+ -]{10,15}"></div><div class="form-group"><label>Email</label><input class="form-control" name="email" type="email" required></div><div class="form-group"><label>Password (minimum 8 characters)</label><input class="form-control" name="password" type="password" minlength="8" required></div><button class="btn btn-primary" style="width:100%">Submit Registration</button></form><p style="text-align:center;margin-top:20px">Already have an account? <a href="/patient-login">Login here</a></p></div></div><script src="/js/language.js"></script></body></html>
