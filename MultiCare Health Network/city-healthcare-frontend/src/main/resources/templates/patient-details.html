<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Patient History</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/doctor-dashboard">+ CityCare</a><div class="nav-links"><a href="/doctor-patients">Patient Search</a><a href="/doctor-dashboard">Dashboard</a></div></div></nav><div class="container section"><div class="card"><h1 th:text="${patient.fullName}"></h1><p><b>Email:</b> <span th:text="${patient.email}"></span></p><p><b>Mobile:</b> <span th:text="${patient.mobile != null ? patient.mobile : 'Not provided'}"></span></p><p><b>Age:</b> <span th:text="${patient.age != null ? patient.age : 'Not provided'}"></span></p><h2>Appointments with you</h2><div th:each="a:${appointments}" class="card"><b th:text="${a.appointmentDate + ' ' + a.appointmentTime}"></b><p th:text="${a.reason + ' — ' + a.status}"></p></div><h2>Patient's Uploaded Report Images</h2><div th:each="report:${reports}" class="card"><h3 th:text="${report.title}"></h3><p th:if="${report.notes != null}" th:text="${report.notes}"></p><p><small th:text="${report.uploadedAt}"></small></p><a th:href="@{/patient-report/{id}/image(id=${report.id})}" target="_blank"><img th:src="@{/patient-report/{id}/image(id=${report.id})}" th:alt="${report.title}" style="max-width:100%;max-height:420px;object-fit:contain;border-radius:8px"></a></div><p th:if="${#lists.isEmpty(reports)}">Patient has not uploaded report images.</p><h2>Prescriptions</h2><div th:each="r:${prescriptions}" class="card"><h3 th:text="${r.diagnosis}"></h3><p style="white-space:pre-wrap" th:text="${r.medicines}"></p><p style="white-space:pre-wrap" th:text="${r.instructions}"></p><small th:text="${r.createdAt}"></small></div><p><a class="btn btn-primary" href="/doctor-patients">Back to Patient History</a></p></div></div><script src="/js/language.js"></script></body></html>
