<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>My Appointments</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/patient-dashboard">+ CityCare</a><a href="/book-appointment">Book appointment</a></div></nav><div class="container page-header"><h1>My Appointments</h1></div><div class="container section"><p th:if="${#lists.isEmpty(appointments)}">No appointments yet.</p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Doctor</th><th>Date</th><th>Time</th><th>Reason</th><th>Status</th></tr></thead><tbody><tr th:each="a:${appointments}"><td th:text="${a.id}"></td><td th:text="${a.doctor.fullName}"></td><td th:text="${a.appointmentDate}"></td><td th:text="${a.appointmentTime}"></td><td th:text="${a.reason}"></td><td th:text="${a.status}"></td></tr></tbody></table></div></div><script src="/js/language.js"></script></body></html>
