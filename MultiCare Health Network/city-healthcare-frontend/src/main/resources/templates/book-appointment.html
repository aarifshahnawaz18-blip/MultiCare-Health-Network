<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Book Appointment</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/patient-dashboard">+ CityCare</a></div></nav><div class="container section"><div class="card" style="max-width:700px;margin:auto"><h1>Book Appointment</h1><p style="color:#b91c1c" th:if="${error}" th:text="${error}"></p><p style="color:#15803d" th:if="${success}" th:text="${success}"></p><form method="post" action="/book-appointment"><div class="form-group"><label>Department</label><select class="form-control" onchange="location.href='/book-appointment?department='+encodeURIComponent(this.value)" ><option value="">All departments</option><option th:each="d:${departments}" th:value="${d}" th:text="${d}" th:selected="${d == department}"></option></select></div><div class="form-group"><label>Approved Doctor</label><select class="form-control" name="doctorId" required><option value="">Select doctor</option><option th:each="d:${doctors}" th:value="${d.id}" th:text="${d.fullName + ' — ' + d.specialization + ' — Fee: ₹' + (d.consultationFee != null ? d.consultationFee : 'Not set')}"></option></select></div><div class="form-row"><div class="form-group"><label>Date</label><input class="form-control" type="date" name="appointmentDate" th:min="${#temporals.format(#temporals.createToday(),'yyyy-MM-dd')}" required></div><div class="form-group"><label>Available 15-minute slot</label><select class="form-control" name="appointmentTime" required><option value="">Select time</option><option th:each="slot:${slots}" th:value="${slot}" th:text="${slot}"></option></select><small>One patient per slot. Clinic hours: 09:00–17:00.</small></div></div><div class="form-group"><label>Reason for visit</label><textarea class="form-control" name="reason" rows="4" required></textarea></div><button class="btn btn-primary">Confirm Appointment</button></form></div></div><script src="/js/language.js"></script></body></html>
