<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>My Prescriptions</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/patient-dashboard">+ CityCare</a></div></nav><div class="container page-header"><h1>My Prescriptions</h1><p class="muted">Only prescriptions written for your account are shown.</p></div><div class="container section"><p th:if="${#lists.isEmpty(prescriptions)}">No prescriptions yet.</p><div class="card" th:each="r:${prescriptions}"><h2 th:text="${r.diagnosis}"></h2><p>Doctor: <span th:text="${r.doctor.fullName}"></span></p><p>Date: <span th:text="${r.createdAt}"></span></p><h3>Medicines</h3><p style="white-space:pre-wrap" th:text="${r.medicines}"></p><h3>Instructions</h3><p style="white-space:pre-wrap" th:text="${r.instructions}"></p></div></div><script src="/js/language.js"></script></body></html>
