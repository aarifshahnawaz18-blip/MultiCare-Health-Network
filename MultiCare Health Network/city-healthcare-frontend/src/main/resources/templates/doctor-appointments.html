<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Doctor Appointments</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/doctor-dashboard">+ CityCare</a><a href="/doctor-prescription">Write prescription</a></div></nav><div class="container page-header"><h1>Your Appointments</h1></div><div class="container section"><p th:if="${#lists.isEmpty(appointments)}">No appointments yet.</p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Patient</th><th>Email</th><th>Date</th><th>Time</th><th>Reason</th><th>Actions</th></tr></thead><tbody><tr th:each="a:${appointments}"><td th:text="${a.id}"></td><td th:text="${a.patientName}"></td><td th:text="${a.patient.email}"></td><td th:text="${a.appointmentDate}"></td><td th:text="${a.appointmentTime}"></td><td th:text="${a.reason}"></td><td><a th:href="@{/doctor-prescription(appointmentId=${a.id})}">Write prescription</a> · <a th:href="@{/patient-details(id=${a.patient.id})}">Patient history</a></td></tr></tbody></table></div></div><script src="/js/language.js"></script></body></html>
