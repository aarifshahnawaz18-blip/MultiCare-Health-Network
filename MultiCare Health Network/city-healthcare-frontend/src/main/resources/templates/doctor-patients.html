<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Patient History Search</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/doctor-dashboard">+ CityCare</a><div class="nav-links"><a href="/doctor-dashboard">Dashboard</a><a href="/logout">Logout</a></div></div></nav><div class="container page-header"><h1>Patient History</h1><p>Search patients who have appointments with you. Open a patient to view their information, visits, prescriptions and uploaded report images.</p></div><div class="container section"><form method="get" action="/doctor-patients" class="card"><label for="q">Search by patient name, email or mobile</label><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="q" class="form-control" style="max-width:500px" type="search" name="q" th:value="${q}" placeholder="Enter name, email or mobile"><button class="btn btn-primary" type="submit">Search</button><a class="btn btn-secondary" href="/doctor-patients">Clear</a></div></form><div class="table-wrap"><table><thead><tr><th>Patient Name</th><th>Email</th><th>Mobile</th><th>History</th></tr></thead><tbody><tr th:each="p:${patients}"><td th:text="${p.fullName}"></td><td th:text="${p.email}"></td><td th:text="${p.mobile}"></td><td><a th:href="@{/patient-details(id=${p.id})}">Open History</a></td></tr></tbody></table></div><p th:if="${#lists.isEmpty(patients)}">No matching patients found in your appointments.</p></div><script src="/js/language.js"></script></body></html>
