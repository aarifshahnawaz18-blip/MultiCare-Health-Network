<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Availability | CityCare</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/doctor-dashboard">+ CityCare</a></div></nav><div class="container section"><div class="card"><h1>Day-wise Availability / Leave</h1><p>Mark any date as a day off. Patients cannot book appointments on that date.</p><p style="color:#b91c1c" th:if="${error}" th:text="${error}"></p><p style="color:#15803d" th:if="${success}" th:text="${success}"></p><form method="post" action="/doctor-availability/toggle"><div class="form-group"><label>Select date</label><input class="form-control" type="date" name="date" th:min="${#temporals.format(#temporals.createToday(),'yyyy-MM-dd')}" required></div><button class="btn btn-primary">Toggle Available / Day Off</button></form><h2>Upcoming days off</h2><p th:if="${#lists.isEmpty(daysOff)}">No upcoming days off.</p><ul><li th:each="day:${daysOff}" th:text="${day.offDate}"></li></ul></div></div><script src="/js/language.js"></script></body></html>
