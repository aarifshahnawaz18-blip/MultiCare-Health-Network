<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Doctor Reviews | CityCare</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/patient-dashboard">+ CityCare</a><div class="nav-links"><a href="/patient-dashboard">Dashboard</a><a href="/patient-appointments">Appointments</a><a href="/logout">Logout</a></div></div></nav><main class="container section"><h1>Doctor Reviews</h1><p th:if="${success}" style="color:green" th:text="${success}"></p><p th:if="${error}" style="color:#b91c1c" th:text="${error}"></p><div class="card premium-form-card review-form-card" style="padding:22px;margin:16px 0"><h2>Write a review</h2><p>Only doctors you have appointments with are listed. Doctor ID is shown for reference.</p><form action="/patient-reviews" method="post" class="form-grid premium-form"><label>Doctor<select name="doctorId" required><option value="">Choose doctor</option><option th:each="d:${doctors}" th:value="${d.id}" th:text="${d.fullName + ' (Doctor ID: ' + d.id + ')'}"></option></select></label><label>Rating<select name="rating" required><option value="5">5 - Excellent</option><option value="4">4 - Very good</option><option value="3">3 - Good</option><option value="2">2 - Fair</option><option value="1">1 - Poor</option></select></label><label style="grid-column:1/-1">Your review<textarea name="review" required maxlength="1500" rows="4" placeholder="Share your experience"></textarea></label><button class="btn btn-primary" type="submit">Submit Review</button></form></div><h2>Your reviews</h2><div class="card" th:each="r:${reviews}" style="padding:18px;margin:12px 0"><h3 th:text="${r.doctor.fullName}"></h3><p>Doctor ID: <b th:text="${r.doctor.id}"></b> · Rating: <b th:text="${r.rating + '/5'}"></b></p><p th:text="${r.review}"></p><small th:text="${r.createdAt}"></small></div><p th:if="${#lists.isEmpty(reviews)}">You haven't submitted any reviews yet.</p></main><script src="/js/language.js"></script></body></html>
