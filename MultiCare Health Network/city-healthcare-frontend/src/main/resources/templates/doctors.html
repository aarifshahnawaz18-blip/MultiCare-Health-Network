<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Approved Doctors</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/">+ CityCare</a><a href="/patient-dashboard">Patient Dashboard</a></div></nav><div class="container page-header"><h1>Find an Approved Doctor</h1><p class="muted">Only approved doctor accounts are listed.</p></div><div class="container section"><form method="get" action="/departments" class="form-group"><label>Department</label><select class="form-control" name="department" onchange="this.form.submit()"><option value="">All departments</option><option th:each="dep:${departments}" th:value="${dep}" th:text="${dep}" th:selected="${dep == department}"></option></select></form><p th:if="${#lists.isEmpty(doctors)}">No approved doctors are available yet.</p><div class="grid grid-3"><div class="card" th:each="d:${doctors}"><img th:if="${d.profilePhotoPath != null}" th:src="@{'/doctor-photo/' + ${d.id}}" alt="Doctor photo" style="width:100px;height:100px;object-fit:cover;border-radius:50%"><h2 th:text="${d.fullName}"></h2><p th:text="${d.specialization}"></p><p><strong>Degree:</strong> <span th:text="${d.degree != null and !#strings.isEmpty(d.degree) ? d.degree : 'Not provided'}"></span></p><p><strong>Consultation Fee:</strong> <span th:text="${d.consultationFee != null ? '₹' + d.consultationFee : 'Not set'}"></span></p><p th:text="${d.email}"></p><a class="btn btn-primary" th:href="@{/book-appointment( department=${d.specialization} )}">Book Appointment</a></div></div></div><script src="/js/language.js"></script></body></html>
